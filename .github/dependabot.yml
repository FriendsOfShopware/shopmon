version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
    ignore:
      # TypeScript 7 has no JavaScript programmatic API, so vue-tsc cannot
      # typecheck Vue SFCs against it. Stay on the 6.x line.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
