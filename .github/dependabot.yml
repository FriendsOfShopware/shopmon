version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
    ignore:
      # Vue's compiler and openapi-ts import the classic TypeScript API.
      # Typechecking uses the typescript-7 alias (7.1 content mappers).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"
